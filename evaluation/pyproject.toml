[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secureqr-id-evaluation"
version = "0.1.0"
description = "Batería de ataques reproducible de SecureQR-ID (ADR-0019): herramienta de evaluación, no un módulo"
readme = "README.md"
requires-python = ">=3.11"
# Paquetes locales del repositorio: se instalan en modo editable desde sus carpetas
# (ver README). No estan publicados en PyPI. `issuer` solo fabrica tokens de prueba.
dependencies = [
  "secureqr-id-issuer",
  "secureqr-id-verifier-service",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
]

[project.scripts]
secureqr-eval = "secureqr_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
