[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secureqr-id-verifier"
version = "0.1.0"
description = "Verificacion fail-closed de tokens SQRID/1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cbor2>=5.6.5,<6",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1"]
test = [
  "fastapi>=0.115,<1",
  "httpx2>=2.12,<3",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
