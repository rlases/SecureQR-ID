name: CI

on:
  # Validar también los PR encadenados cuya base es otra rama.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Las pruebas no requieren modificar el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cada trabajo corre solo si cambió su módulo o algo de lo que depende: los minutos de
  # Actions se cobran por trabajo, redondeados al minuto, y un PR que solo toca
  # documentación no necesita las doce suites. Si este paso falla, todos los trabajos
  # corren: falla hacia probar, nunca hacia saltarse pruebas. Si el flujo se cancela (por
  # ejemplo, porque llegó un push nuevo al PR), no corre nada: `!cancelled()`, no `always()`.
  cambios:
    name: Detectar módulos cambiados
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filtro.outputs.test }}
      server-test: ${{ steps.filtro.outputs.server-test }}
      emision-e2e: ${{ steps.filtro.outputs.emision-e2e }}
      client-test: ${{ steps.filtro.outputs.client-test }}
      issuer-test: ${{ steps.filtro.outputs.issuer-test }}
      verifier-test: ${{ steps.filtro.outputs.verifier-test }}
      verifier-web-test: ${{ steps.filtro.outputs.verifier-web-test }}
      evidence-log-test: ${{ steps.filtro.outputs.evidence-log-test }}
      revocation-test: ${{ steps.filtro.outputs.revocation-test }}
      verifier-service-test: ${{ steps.filtro.outputs.verifier-service-test }}
      anchor-test: ${{ steps.filtro.outputs.anchor-test }}
      chaincode-test: ${{ steps.filtro.outputs.chaincode-test }}
      respaldo-test: ${{ steps.filtro.outputs.respaldo-test }}
      evaluation-test: ${{ steps.filtro.outputs.evaluation-test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          todo=0
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            todo=1
          else
            archivos="$(git diff --name-only "$BASE"...HEAD)"
            # Un cambio en este flujo vuelve a probar todo.
            if printf '%s\n' "$archivos" | grep -qx '.github/workflows/ci.yml'; then todo=1; fi
          fi
          marcar() {
            local valor=false
            if [ "$todo" = 1 ]; then
              valor=true
            elif [ -n "$3" ]; then
              if printf '%s\n' "$archivos" | grep -E "$2" | grep -Evq "$3"; then valor=true; fi
            elif printf '%s\n' "$archivos" | grep -Eq "$2"; then
              valor=true
            fi
            echo "$1=$valor" >> "$GITHUB_OUTPUT"
            echo "$1: $valor"
          }
          marcar test '^mi-app-qr/' '^mi-app-qr/(server|client|shared)/'
          marcar server-test '^mi-app-qr/(server|shared)/' ''
          marcar emision-e2e '^(mi-app-qr/(server|shared)|issuer)/' ''
          marcar client-test '^mi-app-qr/(client|shared)/' ''
          marcar issuer-test '^issuer/' ''
          marcar verifier-test '^(verifier|issuer|evidence-log)/' ''
          marcar verifier-web-test '^verifier-web/' ''
          marcar evidence-log-test '^evidence-log/' ''
          marcar revocation-test '^revocation/' ''
          marcar verifier-service-test '^(verifier-service|verifier|issuer|revocation|evidence-log)/' ''
          marcar anchor-test '^anchor/' '^anchor/chaincode/'
          marcar chaincode-test '^anchor/chaincode/' ''
          marcar respaldo-test '^infra/respaldo/' ''
          marcar evaluation-test '^(evaluation|verifier-service|verifier|issuer|revocation|evidence-log)/' ''

  test:
    name: mi-app-qr — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/package-lock.json

      - run: npm ci
      - run: CI=true npm test -- --watchAll=false

  server-test:
    name: mi-app-qr/server — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.server-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/server/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  emision-e2e:
    name: mi-app-qr — emisión e2e con issuer/
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.emision-e2e == 'true') }}
    # Portal del titular → mi-app-qr/server → servicio local real de issuer/ (issue #85).
    # Clave, contraseña y secreto son sintéticos y efímeros: se crean en el runner y se
    # descartan con él.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: issuer/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/server/package-lock.json

      - run: python -m pip install -e issuer

      - name: Arrancar el servicio local de emisión
        env:
          SQRID_PRIVATE_KEY_PATH: ${{ runner.temp }}/emision.pem
          SQRID_PUBLIC_KEY_PATH: ${{ runner.temp }}/emision.pub
          SQRID_ISSUER_SECRET_FILE: ${{ runner.temp }}/issuer.secret
          SQRID_TOKEN_TTL_SECONDS: '60'
        run: |
          export SQRID_PRIVATE_KEY_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          secureqr-issuer generate-key
          secureqr-issuer generate-secret --output "$SQRID_ISSUER_SECRET_FILE"
          nohup secureqr-issuer serve --port 8765 </dev/null > "$RUNNER_TEMP/issuer.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/issuer.log"; exit 1

      - name: Prueba de punta a punta
        working-directory: mi-app-qr/server
        env:
          ISSUER_E2E_URL: http://127.0.0.1:8765
          ISSUER_E2E_SECRET_FILE: ${{ runner.temp }}/issuer.secret
        run: |
          npm install
          npm run test:e2e:emision

  client-test:
    name: mi-app-qr/client — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.client-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/client/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  issuer-test:
    name: issuer — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.issuer-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: issuer/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  verifier-test:
    name: verifier — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.verifier-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            verifier/pyproject.toml
            issuer/pyproject.toml
            evidence-log/pyproject.toml

      - run: python -m pip install -e ../issuer -e ../evidence-log -e ".[test]"
      - run: python -m pytest

  verifier-web-test:
    name: verifier-web — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.verifier-web-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: verifier-web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  evidence-log-test:
    name: evidence-log — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.evidence-log-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: evidence-log/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  revocation-test:
    name: revocation — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.revocation-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revocation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: revocation/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  verifier-service-test:
    name: verifier-service — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.verifier-service-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            verifier-service/pyproject.toml
            verifier/pyproject.toml
            issuer/pyproject.toml
            revocation/pyproject.toml
            evidence-log/pyproject.toml

      - run: python -m pip install -e ../issuer -e "../verifier[web]" -e ../revocation -e ../evidence-log -e ".[test]"
      - run: python -m pytest

  # Batería de ataques (ADR-0019): pruebas del paquete, que arrancan un verifier-service
  # real en 127.0.0.1. La versión reducida de la batería se agrega en #156.
  evaluation-test:
    name: evaluation — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.evaluation-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            evaluation/pyproject.toml
            verifier-service/pyproject.toml
            verifier/pyproject.toml
            issuer/pyproject.toml
            revocation/pyproject.toml
            evidence-log/pyproject.toml

      - run: python -m pip install -e ../issuer -e "../verifier[web]" -e ../revocation -e ../evidence-log -e ../verifier-service -e ".[test]"
      - run: python -m pytest

  anchor-test:
    name: anchor — tests
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.anchor-test == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: anchor/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  chaincode-test:
    name: anchor/chaincode — go test
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.chaincode-test == 'true') }}
    # Contrato en Go que corre en la red Fabric (ADR-0017, issue #82).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor/chaincode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: anchor/chaincode/go.mod
          cache-dependency-path: anchor/chaincode/go.sum

      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  respaldo-test:
    name: infra/respaldo — respaldo cifrado
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result == 'failure' || needs.cambios.outputs.respaldo-test == 'true') }}
    # Respaldo diario cifrado de las bases del servidor del CCAV (ADR-0018, issue #145).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y age
      - run: infra/respaldo/probar-respaldo.sh
