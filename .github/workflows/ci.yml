name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: mi-app-qr — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/package-lock.json

      - run: npm ci
      - run: CI=true npm test -- --watchAll=false

  server-test:
    name: mi-app-qr/server — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/server/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  client-test:
    name: mi-app-qr/client — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/client/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  issuer-test:
    name: issuer — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: issuer/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  verifier-test:
    name: verifier — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            verifier/pyproject.toml
            issuer/pyproject.toml

      - run: python -m pip install -e ../issuer -e ".[test]"
      - run: python -m pytest

  verifier-web-test:
    name: verifier-web — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: verifier-web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
