name: CI

on:
  # Validar también los PR encadenados cuya base es otra rama.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Las pruebas no requieren modificar el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mi-app-qr — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/package-lock.json

      - run: npm ci
      - run: CI=true npm test -- --watchAll=false

  server-test:
    name: mi-app-qr/server — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/server/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  emision-e2e:
    name: mi-app-qr — emisión e2e con issuer/
    # Portal del titular → mi-app-qr/server → servicio local real de issuer/ (issue #85).
    # Clave, contraseña y secreto son sintéticos y efímeros: se crean en el runner y se
    # descartan con él.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: issuer/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/server/package-lock.json

      - run: python -m pip install -e issuer

      - name: Arrancar el servicio local de emisión
        env:
          SQRID_PRIVATE_KEY_PATH: ${{ runner.temp }}/emision.pem
          SQRID_PUBLIC_KEY_PATH: ${{ runner.temp }}/emision.pub
          SQRID_ISSUER_SECRET_FILE: ${{ runner.temp }}/issuer.secret
          SQRID_TOKEN_TTL_SECONDS: '60'
        run: |
          export SQRID_PRIVATE_KEY_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          secureqr-issuer generate-key
          secureqr-issuer generate-secret --output "$SQRID_ISSUER_SECRET_FILE"
          nohup secureqr-issuer serve --port 8765 </dev/null > "$RUNNER_TEMP/issuer.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/issuer.log"; exit 1

      - name: Prueba de punta a punta
        working-directory: mi-app-qr/server
        env:
          ISSUER_E2E_URL: http://127.0.0.1:8765
          ISSUER_E2E_SECRET_FILE: ${{ runner.temp }}/issuer.secret
        run: |
          npm install
          npm run test:e2e:emision

  client-test:
    name: mi-app-qr/client — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-qr/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mi-app-qr/client/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  issuer-test:
    name: issuer — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: issuer/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  verifier-test:
    name: verifier — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            verifier/pyproject.toml
            issuer/pyproject.toml
            evidence-log/pyproject.toml

      - run: python -m pip install -e ../issuer -e ../evidence-log -e ".[test]"
      - run: python -m pytest

  verifier-web-test:
    name: verifier-web — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: verifier-web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  evidence-log-test:
    name: evidence-log — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: evidence-log/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  revocation-test:
    name: revocation — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revocation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: revocation/pyproject.toml

      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  verifier-service-test:
    name: verifier-service — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            verifier-service/pyproject.toml
            verifier/pyproject.toml
            issuer/pyproject.toml
            revocation/pyproject.toml
            evidence-log/pyproject.toml

      - run: python -m pip install -e ../issuer -e "../verifier[web]" -e ../revocation -e ../evidence-log -e ".[test]"
      - run: python -m pytest

  anchor-test:
    name: anchor — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: anchor/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm test

  chaincode-test:
    name: anchor/chaincode — go test
    # Contrato en Go que corre en la red Fabric (ADR-0017, issue #82).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor/chaincode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: anchor/chaincode/go.mod
          cache-dependency-path: anchor/chaincode/go.sum

      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

